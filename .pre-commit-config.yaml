repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [backend/app]
        additional_dependencies:
          - pydantic>=2.9.0
          - sqlalchemy>=2.0.35
          - fastapi>=0.115.0
          - httpx>=0.27.0
          - playwright>=1.47.0
