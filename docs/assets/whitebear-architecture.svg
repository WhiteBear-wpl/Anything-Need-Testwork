<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>WhiteBear-Test 系统架构</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F8FA"/><stop offset="1" stop-color="#EEF3F1"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5B7A74"/></marker>
  </defs>
  <rect width="1240" height="980" fill="url(#bg)" rx="16"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">WhiteBear-Test 系统架构</text>
  <text x="40" y="72" font-size="14" fill="#64748B">AI 接口自动化测试工作台 · 需求 → 用例 → 骨架 → 执行 的工程闭环</text>

  <!-- ============ 前端层 ============ -->
  <g>
    <rect x="30" y="96" width="1180" height="150" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="124" font-size="15" font-weight="700" fill="#0F766E">前端层 · Web 工作台</text>
    <text x="300" y="124" font-size="12" fill="#94A3B8">React 19 · Vite · antd · 青绿工程风 · WhiteBear-Test 品牌</text>
    <g font-size="13" fill="#0F172A">
      <rect x="50" y="140" width="180" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="140" y="172" text-anchor="middle" font-weight="600">工作台 / 项目空间</text>
      <text x="140" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">概览·AI生成·用例·任务·Wiki·骨架</text>
      <text x="140" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">知识库·生成记录</text>
      <rect x="246" y="140" width="170" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="331" y="172" text-anchor="middle" font-weight="600">总 Wiki（复用）</text>
      <text x="331" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">树形地图 · Markdown</text>
      <text x="331" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">一键复制到项目</text>
      <rect x="432" y="140" width="170" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="517" y="172" text-anchor="middle" font-weight="600">测试骨架</text>
      <text x="517" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">模板 / AI 定制</text>
      <text x="517" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">文件树 · 在线编辑</text>
      <rect x="618" y="140" width="170" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="703" y="172" text-anchor="middle" font-weight="600">AI 用例生成</text>
      <text x="703" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">导入→确认→生成→评审</text>
      <text x="703" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">入库 / 采纳 / 驳回</text>
      <rect x="804" y="140" width="170" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="889" y="172" text-anchor="middle" font-weight="600">AI 小助手 · 评测</text>
      <text x="889" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">ReAct Agent</text>
      <text x="889" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">离线评测回归</text>
      <rect x="990" y="140" width="190" height="80" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="1085" y="172" text-anchor="middle" font-weight="600">登录 / 注册 / 设置</text>
      <text x="1085" y="194" text-anchor="middle" font-size="11" fill="#5B7A74">JWT 鉴权</text>
      <text x="1085" y="210" text-anchor="middle" font-size="11" fill="#5B7A74">模型配置</text>
    </g>
  </g>

  <line x1="620" y1="246" x2="620" y2="272" stroke="#5B7A74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="640" y="266" font-size="12" fill="#64748B">REST / SSE</text>

  <!-- ============ API 层 ============ -->
  <g>
    <rect x="30" y="276" width="1180" height="120" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="304" font-size="15" font-weight="700" fill="#0F766E">API 层 · FastAPI</text>
    <text x="330" y="304" font-size="12" fill="#94A3B8">资源级鉴权 · 统一 /api 前缀</text>
    <g font-size="12" fill="#0F172A" text-anchor="middle">
      <rect x="50" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="116" y="350" font-weight="600">auth</text>
      <rect x="194" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="260" y="350" font-weight="600">projects</text>
      <rect x="338" y="318" width="132" height="56" fill="#E8F5F1" stroke="#0F766E" rx="8"/><text x="404" y="350" font-weight="600">wiki ★</text>
      <rect x="482" y="318" width="132" height="56" fill="#E8F5F1" stroke="#0F766E" rx="8"/><text x="548" y="350" font-weight="600">skeleton ★</text>
      <rect x="626" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="692" y="350" font-weight="600">generations</text>
      <rect x="770" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="836" y="350" font-weight="600">testcases</text>
      <rect x="914" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="980" y="350" font-weight="600">knowledge</text>
      <rect x="1058" y="318" width="132" height="56" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="1124" y="350" font-weight="600">agent</text>
    </g>
    <text x="50" y="392" font-size="11" fill="#94A3B8">★ 本轮新增：项目 Wiki、总 Wiki 复用、测试骨架 REST 接口</text>
  </g>

  <line x1="620" y1="396" x2="620" y2="422" stroke="#5B7A74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ 服务层 ============ -->
  <g>
    <rect x="30" y="426" width="1180" height="150" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="454" font-size="15" font-weight="700" fill="#0F766E">服务层 · 业务逻辑</text>
    <text x="300" y="454" font-size="12" fill="#94A3B8">状态机推导 · 质量闭环 · 运行治理</text>
    <g font-size="12" fill="#0F172A">
      <rect x="50" y="470" width="226" height="86" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="62" y="492" font-weight="600" fill="#0F766E">project_service ★</text>
      <text x="62" y="510" fill="#5B7A74">项目概览 / 阶段状态机</text>
      <text x="62" y="528" fill="#5B7A74">wiki_count · has_skeleton</text>
      <text x="62" y="546" fill="#5B7A74">slug · base_url</text>
      <rect x="292" y="470" width="226" height="86" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="304" y="492" font-weight="600" fill="#0F766E">wiki_service ★</text>
      <text x="304" y="510" fill="#5B7A74">树形页面 · 级联删除</text>
      <text x="304" y="528" fill="#5B7A74">总 Wiki → 项目复制</text>
      <text x="304" y="546" fill="#5B7A74">id_map 后代回填</text>
      <rect x="534" y="470" width="226" height="86" fill="#F0FDFA" stroke="#0F766E" rx="8"/>
      <text x="546" y="492" font-weight="600" fill="#0F766E">skeleton_service ★</text>
      <text x="546" y="510" fill="#5B7A74">Python/Node/Java 模板</text>
      <text x="546" y="528" fill="#5B7A74">AI 驱动定制（Mock/LLM）</text>
      <text x="546" y="546" fill="#5B7A74">文件树生成与持久化</text>
      <rect x="776" y="470" width="200" height="86" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
      <text x="788" y="492" font-weight="600">generation / multi-agent</text>
      <text x="788" y="510" fill="#5B7A74">候选合并 · 来源链</text>
      <text x="788" y="528" fill="#5B7A74">规则质检 · AI Judge</text>
      <text x="788" y="546" fill="#5B7A74">草稿采纳与驳回</text>
      <rect x="992" y="470" width="198" height="86" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/>
      <text x="1004" y="492" font-weight="600">knowledge · RAG</text>
      <text x="1004" y="510" fill="#5B7A74">向量 + BM25 + RRF</text>
      <text x="1004" y="528" fill="#5B7A74">Rerank · 引用溯源</text>
      <text x="1004" y="546" fill="#5B7A74">项目级 Collection 隔离</text>
    </g>
  </g>

  <line x1="620" y1="576" x2="620" y2="602" stroke="#5B7A74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ 数据层 ============ -->
  <g>
    <rect x="30" y="606" width="1180" height="120" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="634" font-size="15" font-weight="700" fill="#0F766E">数据层 · SQLAlchemy + SQLite</text>
    <text x="330" y="634" font-size="12" fill="#94A3B8">领域模型 · 迁移（_migrate_schema）</text>
    <g font-size="12" fill="#0F172A" text-anchor="middle">
      <rect x="50" y="648" width="160" height="58" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="130" y="672">user</text><text x="130" y="692" font-size="11" fill="#94A3B8">account</text>
      <rect x="222" y="648" width="160" height="58" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="302" y="672">project</text><text x="302" y="692" font-size="11" fill="#94A3B8">slug · base_url</text>
      <rect x="394" y="648" width="160" height="58" fill="#E8F5F1" stroke="#0F766E" rx="8"/><text x="474" y="672" font-weight="600">wiki_pages ★</text><text x="474" y="692" font-size="11" fill="#5B7A74">树形 · parent_id</text>
      <rect x="566" y="648" width="160" height="58" fill="#E8F5F1" stroke="#0F766E" rx="8"/><text x="646" y="672" font-weight="600">project_skeletons ★</text><text x="646" y="692" font-size="11" fill="#5B7A74">files JSON</text>
      <rect x="738" y="648" width="160" height="58" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="818" y="672">testcase</text><text x="818" y="692" font-size="11" fill="#94A3B8">正式用例库</text>
      <rect x="910" y="648" width="160" height="58" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="990" y="672">generation_task</text><text x="990" y="692" font-size="11" fill="#94A3B8">候选/草稿</text>
      <rect x="1082" y="648" width="108" height="58" fill="#F8FAFC" stroke="#CBD5E1" rx="8"/><text x="1136" y="672">…</text><text x="1136" y="692" font-size="11" fill="#94A3B8">更多模型</text>
    </g>
  </g>

  <line x1="620" y1="726" x2="620" y2="752" stroke="#5B7A74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ AI 能力层 ============ -->
  <g>
    <rect x="30" y="756" width="1180" height="96" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="784" font-size="15" font-weight="700" fill="#0F766E">AI 能力层 · OpenAI-compatible</text>
    <text x="400" y="784" font-size="12" fill="#94A3B8">Mock 模式免 Key · 失败可降级</text>
    <g font-size="13" fill="#0F172A" text-anchor="middle">
      <rect x="50" y="798" width="200" height="40" fill="#F0FDFA" stroke="#0F766E" rx="8"/><text x="150" y="824">Generation LLM</text>
      <rect x="266" y="798" width="200" height="40" fill="#F0FDFA" stroke="#0F766E" rx="8"/><text x="366" y="824">Evaluation LLM</text>
      <rect x="482" y="798" width="200" height="40" fill="#F0FDFA" stroke="#0F766E" rx="8"/><text x="582" y="824">Embedding</text>
      <rect x="698" y="798" width="200" height="40" fill="#F0FDFA" stroke="#0F766E" rx="8"/><text x="798" y="824">Rerank（可选）</text>
      <rect x="914" y="798" width="276" height="40" fill="#FFF7ED" stroke="#EA580C" rx="8"/><text x="1052" y="824">Mock 模式（LLM_MOCK_MODE=true）</text>
    </g>
  </g>

  <line x1="620" y1="852" x2="620" y2="878" stroke="#5B7A74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ 产物/执行 ============ -->
  <g>
    <rect x="30" y="882" width="1180" height="78" fill="#FFFFFF" stroke="#E2E8F0" rx="12"/>
    <text x="50" y="910" font-size="15" font-weight="700" fill="#0F766E">产物 · 可运行测试骨架</text>
    <g font-size="12" fill="#0F172A" text-anchor="middle">
      <rect x="120" y="920" width="280" height="30" fill="#F1F5F9" stroke="#CBD5E1" rx="7"/><text x="260" y="940">Python · pytest + requests</text>
      <rect x="430" y="920" width="280" height="30" fill="#F1F5F9" stroke="#CBD5E1" rx="7"/><text x="570" y="940">Node.js · Jest + axios</text>
      <rect x="740" y="920" width="280" height="30" fill="#F1F5F9" stroke="#CBD5E1" rx="7"/><text x="880" y="940">Java · JUnit 5 + RestAssured</text>
    </g>
  </g>
</svg>
